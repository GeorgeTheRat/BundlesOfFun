[manifest]
version = "1.0.0"

# live updates to the risk and tidal water debuffs
[[patches]] 
[patches.pattern]
target = "card.lua"
pattern = "function Card:update(dt)"
position = "after"
match_indent = true
payload = '''
-- bof patch
local active_bof_blind = G.GAME and G.GAME.blind
local active_bof_blind_key = BOF.nc(active_bof_blind, "config", "blind", "key")
local is_risk = active_bof_blind_key == "bl_bof_risk" and not active_bof_blind.disabled
local is_water = active_bof_blind_key == "bl_bof_water" and not active_bof_blind.disabled
if G.jokers and self.area == G.jokers and (is_risk or is_water) then
    local rightmost = self == G.jokers.cards[#G.jokers.cards]
    local target = is_water and (#G.jokers.cards > 0 and (self == G.jokers.cards[1] or rightmost)) or rightmost
    if is_water then
        local edge_signature
        if #G.jokers.cards == 1 then
            edge_signature = tostring(G.jokers.cards[1].sort_id or G.jokers.cards[1].ID)
        elseif #G.jokers.cards > 1 then
            local first_edge = tostring(G.jokers.cards[1].sort_id or G.jokers.cards[1].ID)
            local last_edge = tostring(G.jokers.cards[#G.jokers.cards].sort_id or G.jokers.cards[#G.jokers.cards].ID)
            edge_signature = first_edge < last_edge and (first_edge .. ":" .. last_edge) or (last_edge .. ":" .. first_edge)
        end
        if G.GAME.bof_water_edge_signature ~= edge_signature then
            G.GAME.bof_water_edge_signature = edge_signature
            if edge_signature then
                play_sound("cancel", 0.7, 0.7)
            end
        end
        local previous_target = self.ability.bof_water_edge_debuff
        if previous_target ~= target and (previous_target or target) then
            self.ability.bof_water_edge_debuff = target and true or nil
            SMODS.recalc_debuff(self)
            if target then
                self:juice_up()
                active_bof_blind:juice_up()
            end
        end
    elseif self.debuff ~= target then
        self:set_debuff(target)
        if target then
            self:juice_up()
            active_bof_blind:juice_up()
            play_sound("cancel", 0.7, 0.7)
        end
    end
    if is_risk and rightmost then
        G.GAME.bof_risk_joker = self
    end
elseif G.GAME and G.GAME.bof_risk_joker == self and self.debuff then
    self:set_debuff(false)
    G.GAME.bof_risk_joker = nil
end
if self.ability and self.ability.bof_water_edge_debuff and (not is_water or self.area ~= G.jokers) then
    self.ability.bof_water_edge_debuff = nil
    if G.GAME.blind then
        SMODS.recalc_debuff(self)
    else
        self:set_debuff(false)
    end
end
if G.GAME and not is_water then
    G.GAME.bof_water_edge_signature = nil
end
-- patch end
'''

# hide the skip button (and its reward box) for blinds made unskippable by
# tiny/particle; delegates to BundlesOfFun.blind_skip_ui defined in lib/hooks.lua
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
position = "at"
match_indent = true
pattern = '''
        not run_info and {n=G.UIT.C, config={align = "cm", colour = G.C.UI.BACKGROUND_INACTIVE, minh = 0.6, minw = 2, maxw = 2, padding = 0.07, r = 0.1, shadow = true, hover = true, one_press = true, button = 'skip_blind', func = 'hover_tag_proxy', ref_table = _tag}, nodes={
          {n=G.UIT.T, config={text = localize('b_skip_blind'), scale = 0.4, colour = G.C.UI.TEXT_INACTIVE}}
        }} or {n=G.UIT.C, config={align = "cm", padding = 0.1, emboss = 0.05, colour = mix_colours(G.C.BLUE, G.C.BLACK, 0.4), r = 0.1, maxw = 2}, nodes={
          {n=G.UIT.T, config={text = localize('b_skip_reward'), scale = 0.35, colour = G.C.WHITE}},
        }},
'''
payload = '''
-- bof patch
BundlesOfFun.blind_skip_ui(blind_choice, run_info, _tag),
-- patch end
'''

# tiny makes the next Small Blind's real chip requirement larger (applied to
# G.GAME.blind.chips/chip_text in Blind:set_blind, in lib/hooks.lua), but the
# blind-select screen computes its own preview amount independently of that,
# so the preview needs its own adjustment to match what the fight will
# actually require.
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
position = "after"
match_indent = true
pattern = '''
  local blind_amt = get_blind_amount(G.GAME.round_resets.blind_ante)*blind_choice.config.mult*G.GAME.starting_params.ante_scaling
'''
payload = '''
-- bof patch
blind_amt = BundlesOfFun.blind_amount_preview(type, blind_amt)
-- patch end
'''

# give displayed blind score a stable ID for howling air refresh animation
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
position = "at"
match_indent = true
pattern = '''
{n=G.UIT.T, config={text = number_format(blind_amt), scale = score_number_scale(0.9, blind_amt), colour = disabled and G.C.UI.TEXT_INACTIVE or G.C.RED, shadow =  not disabled}}
'''
payload = '''
-- bof patch
{n=G.UIT.T, config={id = 'blind_score', text = number_format(blind_amt), scale = score_number_scale(0.9, blind_amt), colour = disabled and G.C.UI.TEXT_INACTIVE or G.C.RED, shadow =  not disabled}}
-- patch end
'''

# refresh small/big previews when reroll adds or removes howling air
[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
position = "at"
match_indent = true
pattern = '''
local par = G.blind_select_opts.boss.parent
G.GAME.round_resets.blind_choices.Boss = get_new_boss()
'''
payload = '''
-- bof patch
local par = G.blind_select_opts.boss.parent
local bof_air_was_active = BundlesOfFun.air_active()
G.GAME.round_resets.blind_choices.Boss = get_new_boss()
if G.GAME.round_resets.blind_choices.Boss ~= "bl_bof_air" then
    G.GAME.bof_air_active_ante = nil
end
if BundlesOfFun.refresh_air_blinds(bof_air_was_active) then
    BundlesOfFun.juice_air_blind_scores()
end
-- patch end
'''
